{% load static %}
<html>
  <head>
    <title>Pokedex</title>
    <link href="{% static "bootstrap.min.css" %}" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <div class="bg-primary text-white p-4 text-center">
        <img src="{% static "logo.png" %}" alt="Pokedex Logo" class="img-fluid">
      </div>
      <a class="nav-link" href="{% url 'pokedex:trainers' %}">Entrenadores</a>  
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'pokedex:add_pokemon' %}">Añadir Pokemon</a>
        <a class="nav-link" href="{% url 'pokedex:add_trainer' %}">Añadir Entrenador</a>
        <a class="nav-link" href="{% url 'logout' %}">Cerrar Sesión</a>
      {% else %}
        <a class="nav-link" href="{% url 'pokedex:login' %}">Iniciar sesión</a>
      {% endif %}
      {% block content %}{% endblock content %}
    </div>
  </body>
</html>
